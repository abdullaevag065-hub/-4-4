<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; color: #333; }
    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      transition: background-color 0.2s;
    }
    button:hover { background-color: #0056b3; }
    
    
    #status-message {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin: 15px 0;
    }
    .loading { color: #888; }
    .error { color: #dc3545; }

    
    #output {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .card h3 { margin-top: 0; color: #222; }
    .card em { display: block; color: #555; margin-bottom: 10px; }

    
    .todo-list {
      grid-column: 1 / -1;
      list-style: none;
      padding: 0;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .todo-item {
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      font-weight: 500;
    }
    .todo-item:last-child {
         border-bottom: none; }
    .completed { 
        color: #28a745; background-color: #e8f5e9; }
    .pending {
         color: #dc3545; background-color: #fde8e8; }
  </style>
</head>
<body>

  <h1>Панель данных JSONPlaceholder</h1>
  
  <div class="nav-buttons">
    <button onclick="loadData('posts')">Посты</button>
    <button onclick="loadData('comments')">Комментарии</button>
    <button onclick="loadData('todos')">Список дел</button>
    <button onclick="loadData('photos')">Бонус: Фото</button>
    <button onclick="loadData('postss')">Тест ошибки (Сломать URL)</button>
  </div>

  
  <div id="status-message"></div>
  
  
  <div id="output"></div>

    
    <script src="./main.js"></script>
</body>
</html>
